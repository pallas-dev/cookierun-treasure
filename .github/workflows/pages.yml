# 사이트 배포 + 보물 데이터 자동 갱신
#
#   · main 에 올리면(push) 바로 사이트에 반영돼요.
#   · 매일 아침(한국 시간 6시 반쯤) 쿠키런HUB 도감을 확인해서, 바뀐 게 있으면 커밋하고 다시 배포해요.
#   · 지금 바로 갱신하려면: 저장소 → Actions → "배포 · 보물 데이터 갱신" → Run workflow
#   · tools/update_data.py 의 설정을 바꿔서 올려도 데이터를 다시 만들어요.
#
# 처음 한 번만: 저장소 Settings → Pages → Build and deployment → Source 를 "GitHub Actions" 로 바꿔 주세요.
name: 배포 · 보물 데이터 갱신

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 21 * * *" # UTC 21:23 = 한국 시간 06:23
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    name: 보물 데이터 갱신
    # 매일 자동 실행 · Run workflow 버튼 · 갱신 스크립트를 고쳐서 올렸을 때만
    if: github.event_name != 'push' || contains(toJSON(github.event.commits), 'tools/update_data.py')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.update.outputs.changed }}
    steps:
      - uses: actions/checkout@v7

      - name: 쿠키런HUB에서 보물 목록 받기
        id: update
        run: python3 tools/update_data.py

      - name: 바뀐 게 있으면 커밋
        if: steps.update.outputs.changed == 'true'
        env:
          SUMMARY: ${{ steps.update.outputs.summary }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data images
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "보물 데이터 갱신: ${SUMMARY}"
          git pull --rebase
          git push

  deploy:
    name: 사이트 배포
    needs: update
    # 직접 올렸을 때 · 버튼으로 실행했을 때 · 매일 확인에서 바뀐 게 있을 때
    if: ${{ !cancelled() && (github.event_name != 'schedule' || needs.update.outputs.changed == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }} # 방금 커밋한 데이터까지 포함

      - name: 사이트 파일 모으기
        run: |
          mkdir _site
          cp -r index.html css js data images _site/
          # 브라우저가 예전 파일을 쓰지 않도록 ?v=dev 를 이번 커밋 번호로 바꿔요
          sed -i "s/?v=dev/?v=$(git rev-parse --short HEAD)/g" _site/index.html

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: 배포
        id: deployment
        uses: actions/deploy-pages@v5
