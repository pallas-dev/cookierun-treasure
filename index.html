<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>보물 랜덤 뽑기 · 쿠키런</title>
  <meta name="description" content="쿠키런 for Kakao 보물 랜덤 뽑기 — S·A·B·C 등급, 진화/미진화 필터, 칸별 리롤, 중복 없이 뽑기">
  <meta name="theme-color" content="#14111c">
  <meta property="og:title" content="보물 랜덤 뽑기 · 쿠키런">
  <meta property="og:description" content="쿠키런 for Kakao 보물 랜덤 뽑기 — 등급·진화 필터, 칸별 리롤, 중복 없이 뽑기">
  <link rel="icon" href="images/ui/grade-s.png">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <!-- 파일 주소 끝의 v=dev 는 배포할 때 버전 번호로 바뀌어요 → 갱신 직후에도 브라우저가 새 파일을 받아요 -->
  <link rel="stylesheet" href="css/style.css?v=dev">
  <!-- 설정 → 보물 목록(자동 생성) → 동작 순서로 불러와요 -->
  <script src="js/config.js?v=dev" defer></script>
  <script src="data/treasures.js?v=dev" defer></script>
  <script src="js/app.js?v=dev" defer></script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"><span class="tframe" data-grade="S"><span class="q">?</span></span></span>
        <div>
          <h1>보물 랜덤 뽑기</h1>
          <p class="brand-sub">쿠키런 for Kakao · 보물 <b id="totalCount">-</b>종 · 데이터 <span id="dataDate">-</span> 기준</p>
        </div>
      </div>
      <button type="button" class="btn ghost filter-toggle" id="filterToggle" aria-expanded="false" aria-controls="sidebar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
        필터 · 후보 <b id="poolCountMini">-</b>개
      </button>
    </header>

    <aside class="sidebar" id="sidebar" aria-label="뽑기 필터">
      <div class="pool-card" id="poolCard">
        <span class="pool-label">뽑기 후보</span>
        <span class="pool-num"><strong id="poolCount">-</strong>개</span>
        <p class="pool-note" id="poolNote" hidden></p>
        <p class="pool-warn" id="poolWarn" hidden></p>
      </div>

      <section class="filter-group">
        <div class="group-head">
          <h2>등급</h2>
          <button type="button" class="mini-link" data-all="grades">전체</button>
        </div>
        <div class="chips chips-grade" id="gradeChips"></div>
      </section>

      <section class="filter-group">
        <div class="group-head">
          <h2>진화</h2>
          <button type="button" class="mini-link" data-all="evo">전체</button>
        </div>
        <div class="chips" id="evoChips"></div>
      </section>

      <section class="filter-group">
        <div class="group-head">
          <h2>종류</h2>
          <button type="button" class="mini-link" data-all="cats">전체</button>
        </div>
        <div class="chips" id="catChips"></div>
      </section>

      <section class="filter-group options">
        <div class="group-head"><h2>옵션</h2></div>
        <fieldset class="limit">
          <legend>리롤 횟수</legend>
          <div class="seg">
            <label><input type="radio" name="limitMode" value="count"><span>횟수 지정</span></label>
            <label><input type="radio" name="limitMode" value="unlimited"><span>무제한</span></label>
            <label><input type="radio" name="limitMode" value="none"><span>리롤 불가</span></label>
          </div>
          <div class="stepper" id="limitCountRow" hidden>
            <span>최대</span>
            <button type="button" data-step="-1" aria-label="리롤 횟수 1 줄이기">−</button>
            <input type="number" id="limitCount" min="1" max="99" step="1" inputmode="numeric" aria-label="한 판에 리롤할 수 있는 횟수">
            <button type="button" data-step="1" aria-label="리롤 횟수 1 늘리기">+</button>
            <span>회</span>
          </div>
        </fieldset>
        <label class="opt-switch">
          <input type="checkbox" id="optNoRepeat">
          <span class="switch" aria-hidden="true"></span>
          <span class="opt-text">중복 없이 뽑기<small>한 번 나온 보물은 초기화 전까지 다시 안 나와요</small></span>
        </label>
        <label class="opt-switch">
          <input type="checkbox" id="optFamily">
          <span class="switch" aria-hidden="true"></span>
          <span class="opt-text">진화 전·후 함께 안 나오게<small>예: 성스러운 깃털 + 무지개빛 깃털</small></span>
        </label>
        <label class="opt-switch">
          <input type="checkbox" id="optAnim">
          <span class="switch" aria-hidden="true"></span>
          <span class="opt-text">뽑기 연출</span>
        </label>
      </section>
    </aside>

    <main class="main">
      <section class="slots" id="slots" aria-label="뽑힌 보물"></section>

      <div class="actionbar">
        <div class="action-main">
          <button type="button" class="btn primary big" id="rollAll">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8.5" cy="8.5" r="1.3"/><circle cx="15.5" cy="15.5" r="1.3"/><circle cx="15.5" cy="8.5" r="1.3"/><circle cx="8.5" cy="15.5" r="1.3"/></svg>
            <span id="rollAllLabel">보물 뽑기</span>
          </button>
          <div class="reroll-meter" id="rerollMeter" aria-live="polite">
            <span class="meter-label">리롤</span>
            <strong id="rerollUsed">0</strong><span class="meter-unit">회</span>
            <span class="meter-left" id="rerollLeft"></span>
          </div>
        </div>
        <div class="action-sub">
          <button type="button" class="btn" id="copyResult">결과 복사</button>
          <button type="button" class="btn danger-ghost" id="clearSlots" title="뽑은 보물을 비우고 처음부터">초기화</button>
        </div>
      </div>
      <p class="hint">단축키 <kbd>R</kbd> 새로 뽑기 · <span id="hintKeys"><kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd></span> 해당 칸 리롤</p>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="sr-only" id="announcer" aria-live="polite"></div>
  <noscript><p class="noscript">이 페이지는 자바스크립트가 필요해요.</p></noscript>
</body>
</html>
